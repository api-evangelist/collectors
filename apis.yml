description: >-
  Collectors (Collectors Holdings, Inc.) is the parent company behind PSA, PCGS, Beckett, SGC,
  Card Ladder, and Collectors vault and financial services — the infrastructure powering trust,
  authentication, grading, vaulting, and marketplace services for trading cards, coins, currency,
  and memorabilia. Its PSA brand publishes a public developer API for certificate verification,
  grading order and submission tracking, and population reports, secured with Bearer access tokens.
