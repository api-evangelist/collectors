openapi: 3.2.0
info:
  version: v1
  title: PSA Public API Methods API
  description: This is the Swagger documentation for the PSA Public API. For security, it uses Bearer Authentication. To start testing calls, click Authorize and fill the textbox with `Bearer yourToken`. You can get your token here.
servers:
- url: /publicapi
security:
- Bearer: []
tags:
- name: PSA Public API Methods
paths:
  /cert/GetByCertNumber/{certNumber}:
    get:
      tags:
      - PSA Public API Methods
      operationId: Cert_GetByCertNumber
      parameters:
      - name: certNumber
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCertificationModel'
            text/json:
              schema:
                $ref: '#/components/schemas/PublicCertificationModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/PublicCertificationModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/PublicCertificationModel'
      summary: Cert get by cert number
      x-summary-source: derived
  /cert/GetByCertNumberForFileAppend/{certNumber}:
    get:
      tags:
      - PSA Public API Methods
      operationId: Cert_GetByCertNumberForFileAppend
      parameters:
      - name: certNumber
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertFileAppendModel'
            text/json:
              schema:
                $ref: '#/components/schemas/CertFileAppendModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/CertFileAppendModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/CertFileAppendModel'
      summary: Cert get by cert number for file append
      x-summary-source: derived
  /cert/GetImagesByCertNumber/{certNumber}:
    get:
      tags:
      - PSA Public API Methods
      operationId: Cert_GetImagesByCertNumber
      parameters:
      - name: certNumber
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
      summary: Cert get images by cert number
      x-summary-source: derived
  /order/GetProgress/{orderNumber}:
    get:
      tags:
      - PSA Public API Methods
      operationId: Order_GetProgress
      parameters:
      - name: orderNumber
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderProgress'
            text/json:
              schema:
                $ref: '#/components/schemas/OrderProgress'
            application/xml:
              schema:
                $ref: '#/components/schemas/OrderProgress'
            text/xml:
              schema:
                $ref: '#/components/schemas/OrderProgress'
      summary: Order get progress
      x-summary-source: derived
  /order/GetSubmissionProgress/{submissionNumber}:
    get:
      tags:
      - PSA Public API Methods
      operationId: Order_GetSubmissionProgress
      parameters:
      - name: submissionNumber
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderProgress'
            text/json:
              schema:
                $ref: '#/components/schemas/OrderProgress'
            application/xml:
              schema:
                $ref: '#/components/schemas/OrderProgress'
            text/xml:
              schema:
                $ref: '#/components/schemas/OrderProgress'
      summary: Order get submission progress
      x-summary-source: derived
  /pop/GetPSASpecPopulation/{specID}:
    get:
      tags:
      - PSA Public API Methods
      operationId: Pop_GetPSASpecPopulation
      parameters:
      - name: specID
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PSASpecPopulationModel'
            text/json:
              schema:
                $ref: '#/components/schemas/PSASpecPopulationModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/PSASpecPopulationModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/PSASpecPopulationModel'
      summary: Pop get PSA spec population
      x-summary-source: derived
components:
  schemas:
    OrderProgress:
      type: object
      properties:
        orderNumber:
          type: string
        problemOrder:
          type: boolean
        readyForLabelReview:
          type: boolean
        gradesReady:
          type: boolean
        accountingHold:
          type: boolean
        shipped:
          type: boolean
        shipTrackingNumber:
          type: string
        shipCarrier:
          type: string
        orderProgressSteps:
          type: array
          items:
            $ref: '#/components/schemas/OrderProgressStep'
    SubjectDetail:
      type: object
      properties:
        FirstName:
          type: string
        LastName:
          type: string
        IsStamp:
          type: boolean
        IsClubhouse:
          type: boolean
        IsInThePresence:
          type: boolean
        AuthenticationDate:
          format: date-time
          type: string
        AuthenticationLocation:
          type: string
        Count:
          format: int32
          type: integer
    CertFileAppendPSACert:
      type: object
      properties:
        CertNumber:
          type: string
        Year:
          type: string
        Category:
          type: string
        SetName:
          type: string
        CardNumber:
          type: string
        Subject:
          type: string
        Variety:
          type: string
        Grade:
          type: string
        QualifierCode:
          type: string
        GradeDescription:
          type: string
    PSASpecPopSummmaryModel:
      type: object
      properties:
        Total:
          format: int32
          type: integer
        Auth:
          format: int32
          type: integer
        Grade1:
          format: int32
          type: integer
        Grade1Q:
          format: int32
          type: integer
        Grade1_5:
          format: int32
          type: integer
        Grade1_5Q:
          format: int32
          type: integer
        Grade2:
          format: int32
          type: integer
        Grade2Q:
          format: int32
          type: integer
        Grade2_5:
          format: int32
          type: integer
        Grade3:
          format: int32
          type: integer
        Grade3Q:
          format: int32
          type: integer
        Grade3_5:
          format: int32
          type: integer
        Grade4:
          format: int32
          type: integer
        Grade4Q:
          format: int32
          type: integer
        Grade4_5:
          format: int32
          type: integer
        Grade5:
          format: int32
          type: integer
        Grade5Q:
          format: int32
          type: integer
        Grade5_5:
          format: int32
          type: integer
        Grade6:
          format: int32
          type: integer
        Grade6Q:
          format: int32
          type: integer
        Grade6_5:
          format: int32
          type: integer
        Grade7:
          format: int32
          type: integer
        Grade7Q:
          format: int32
          type: integer
        Grade7_5:
          format: int32
          type: integer
        Grade8:
          format: int32
          type: integer
        Grade8Q:
          format: int32
          type: integer
        Grade8_5:
          format: int32
          type: integer
        Grade9:
          format: int32
          type: integer
        Grade9Q:
          format: int32
          type: integer
        Grade10:
          format: int32
          type: integer
    PublicDNACert:
      type: object
      properties:
        CertNumber:
          type: string
        ItemDescription:
          type: string
        Tag:
          type: string
        PrimarySubjects:
          type: array
          items:
            $ref: '#/components/schemas/SubjectDetail'
        OtherSubjects:
          type: array
          items:
            $ref: '#/components/schemas/SubjectDetail'
        Attributes:
          type: array
          items:
            $ref: '#/components/schemas/KeyValuePairOfStringAndString'
        ItemEra:
          type: string
        Model:
          type: string
        Length:
          type: string
        Weight:
          type: string
        AuthenticationResult:
          type: string
        SignatureGrade:
          type: string
        BaseballGrade:
          type: string
        Notes:
          type: string
        DNAItemType:
          type: string
    CertFileAppendDNACert:
      type: object
      properties:
        AuthenticationResult:
          type: string
        PrimarySubject:
          type: string
    CertFileAppendModel:
      type: object
      properties:
        CertificationType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          type: integer
        IsHologram:
          type: string
        IsReverseBarcode:
          type: string
        PSACert:
          $ref: '#/components/schemas/CertFileAppendPSACert'
        PSAPopulation:
          $ref: '#/components/schemas/CertFileAppendPSAPopulation'
        DNACert:
          $ref: '#/components/schemas/CertFileAppendDNACert'
    PSASpecPopulationModel:
      type: object
      properties:
        SpecID:
          format: int32
          type: integer
        Description:
          type: string
        PSAPop:
          $ref: '#/components/schemas/PSASpecPopSummmaryModel'
        PSADNAPop:
          $ref: '#/components/schemas/PSASpecPopSummmaryModel'
    OrderProgressStep:
      required:
      - step
      type: object
      properties:
        index:
          format: int32
          type: integer
        step:
          format: int32
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          - 8
          type: integer
        completed:
          type: boolean
    PublicCertificationModel:
      type: object
      properties:
        PSACert:
          $ref: '#/components/schemas/PublicPSACert'
        DNACert:
          $ref: '#/components/schemas/PublicDNACert'
    KeyValuePairOfStringAndString:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    PublicPSACert:
      type: object
      properties:
        CertNumber:
          type: string
        SpecID:
          format: int32
          type: integer
        SpecNumber:
          type: string
        LabelType:
          type: string
        ReverseBarCode:
          type: boolean
        Year:
          type: string
        Brand:
          type: string
        Category:
          type: string
        CardNumber:
          type: string
        Subject:
          type: string
        Variety:
          type: string
        IsPSADNA:
          type: boolean
        IsDualCert:
          type: boolean
        GradeDescription:
          type: string
        CardGrade:
          type: string
        PrimarySigners:
          type: array
          items:
            type: string
        OtherSigners:
          type: array
          items:
            type: string
        AutographGrade:
          type: string
        TotalPopulation:
          format: int32
          type: integer
        TotalPopulationWithQualifier:
          format: int32
          type: integer
        PopulationHigher:
          format: int32
          type: integer
        T206PopulationAllBacks:
          format: int32
          type: integer
        T206PopulationHigherAllBacks:
          format: int32
          type: integer
        ItemStatus:
          type: string
    CertFileAppendPSAPopulation:
      type: object
      properties:
        TotalPopulation:
          type: string
        PopulationHigher:
          type: string
        TotalPopulationWithQualifier:
          type: string
        T206PopulationAllBacks:
          type: string
        T206PopulationHigherAllBacks:
          type: string
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
